<section id="numeros" class="py-14 lg:py-16">
  <app-container>
    <div class="rounded-lg bg-brand px-6 py-12 text-brand-ink sm:px-10 lg:px-14">
      <div class="max-w-2xl">
        <h2 appReveal="up" class="font-display text-h2 font-bold">Sabias que?</h2>
        <p appReveal="up" [revealDelay]="80" class="mt-3 leading-relaxed opacity-80">
          O Sassapa em números — uma comunidade escolar que cresce com a cidade de Luanda.
        </p>
      </div>

      @if (estatisticas().length) {
        <!-- TODO(colégio): confirmar valores oficiais -->
        <div
          class="mt-10 grid gap-10 sm:grid-cols-2 lg:grid-cols-4"
          appRevealGroup
          role="list"
          aria-label="Números do colégio"
        >
          @for (estatistica of estatisticas(); track estatistica.id) {
            <div role="listitem" appReveal="up">
              <app-stat-block
                [valor]="estatistica.valor"
                [label]="estatistica.label"
                [descricao]="estatistica.descricao"
              />
            </div>
          }
        </div>
      } @else {
        <div class="mt-10 grid gap-10 sm:grid-cols-2 lg:grid-cols-4" aria-hidden="true">
          @for (_ of [1, 2, 3, 4]; track $index) {
            <div class="flex flex-col gap-3">
              <div class="h-12 w-24 animate-pulse rounded bg-brand-deep"></div>
              <div class="h-3 w-16 animate-pulse rounded bg-brand-deep"></div>
            </div>
          }
        </div>
      }
    </div>
  </app-container>
</section>
