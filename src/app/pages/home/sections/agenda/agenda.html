<section id="agenda" class="bg-surface-soft py-14 lg:py-16">
  <app-container>
    <div class="mb-8 flex items-end justify-between gap-6">
      <div>
        <span class="block h-[3px] w-12 bg-accent" appReveal="fade" aria-hidden="true"></span>
        <h2 appReveal="up" class="mt-4 font-display text-h2 font-bold text-ink">Agenda do colégio</h2>
        <p appReveal="up" [revealDelay]="80" class="mt-3 max-w-prose leading-relaxed text-ink-2">
          Reuniões, festivais e actividades que marcam a vida da nossa comunidade escolar.
        </p>
      </div>
      <div class="hidden shrink-0 md:block">
        <app-vertical-label label="Agenda" />
      </div>
    </div>

    <div appReveal="up">
      <app-event-bar [eventos]="eventos()" />
    </div>
  </app-container>
</section>
