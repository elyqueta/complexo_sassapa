<nav
  aria-label="Navegação por secções"
  class="fixed right-6 top-1/2 z-40 hidden -translate-y-1/2 flex-col items-center gap-3 lg:flex"
>
  @for (seccao of seccoes(); track seccao.id; let i = $index) {
    <button
      type="button"
      class="flex h-11 w-11 items-center justify-center rounded-full bg-surface transition-transform duration-fast ease-out motion-reduce:transition-none"
      [class.scale-100]="i === activo()"
      [class.shadow-float]="i === activo()"
      [class.ring-2]="i === activo()"
      [class.ring-accent]="i === activo()"
      [class.scale-75]="i !== activo()"
      [class.opacity-70]="i !== activo()"
      [attr.aria-label]="seccao.label"
      [attr.aria-current]="i === activo() ? 'true' : null"
      (click)="irPara(seccao.id)"
    >
      <img [src]="seccao.icon" alt="" aria-hidden="true" class="h-5 w-5" />
    </button>
  }
</nav>
