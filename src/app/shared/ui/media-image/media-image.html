<div class="relative overflow-hidden bg-surface-soft" [class]="aspectClass">
  <img
    [src]="src()"
    [attr.srcset]="srcset || null"
    [sizes]="sizesValue"
    [alt]="alt()"
    [attr.width]="width()"
    [attr.height]="height()"
    [attr.loading]="loading"
    [attr.fetchpriority]="priority() ? 'high' : null"
    decoding="async"
    class="h-full w-full object-cover transition-opacity duration-base ease-out motion-reduce:transition-none"
    [class.opacity-0]="!loaded()"
    [class.opacity-100]="loaded()"
    (load)="onLoad()"
  />
</div>
