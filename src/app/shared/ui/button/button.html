<a
  [routerLink]="routerLink()"
  [attr.href]="routerLink() ? null : href()"
  [attr.role]="!routerLink() && !href() ? 'button' : null"
  [attr.tabindex]="!routerLink() && !href() ? 0 : null"
  [class]="classes"
  class="no-underline"
  (click)="onClick($event)"
>
  <span><ng-content></ng-content></span>
  @if (arrow()) {
    <app-icon
      name="arrow-right"
      class="transition-transform duration-fast ease-out group-hover:translate-x-1 motion-reduce:transition-none"
    />
  }
</a>
