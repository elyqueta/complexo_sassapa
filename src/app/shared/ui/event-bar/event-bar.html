@if (eventos().length) {
  <div class="relative">
    <!-- Cartão flutuante com o detalhe do evento activo -->
    @if (expandido()) {
      <div
        class="relative z-10 mx-auto mb-[-2.5rem] w-[min(34rem,100%)] overflow-hidden rounded-lg bg-surface shadow-float transition-transform duration-reveal ease-out motion-reduce:transition-none"
      >
        <div class="flex flex-col gap-4 p-6 sm:flex-row sm:items-center sm:gap-6">
          <app-media-image
            [src]="eventoActivo().imagem ?? ''"
            [alt]="imgAlt(eventoActivo())"
            aspect="portrait"
            sizes="120px"
            class="h-28 w-24 shrink-0 overflow-hidden rounded-md sm:h-32 sm:w-28"
          />
          <div class="flex flex-col gap-2">
            <app-category-tag label="Evt'" />
            <h3 class="font-display text-h3 font-bold text-ink">{{ eventoActivo().titulo }}</h3>
            <p class="text-sm leading-relaxed text-ink-2">{{ eventoActivo().descricao }}</p>
            <app-button variant="tint" size="sm" routerLink="/noticias" class="self-start">
              Mais informação
            </app-button>
          </div>
        </div>
      </div>
    }

    <!-- Barra de marca da agenda -->
    <div
      class="relative z-0 flex flex-col gap-6 rounded-t-lg bg-brand px-6 py-10 text-brand-ink sm:px-10 lg:flex-row lg:items-center lg:justify-between"
    >
      <ul class="flex flex-col gap-6 sm:flex-row sm:gap-10">
        @for (evento of eventos(); track evento.id; let i = $index) {
          <li>
            <button
              type="button"
              class="flex items-center gap-4 text-left transition-opacity duration-fast ease-out motion-reduce:transition-none"
              [class.opacity-60]="i !== activo()"
              [class.opacity-100]="i === activo()"
              [attr.aria-pressed]="i === activo()"
              (click)="selecionar(i)"
            >
              <app-media-image
                [src]="evento.imagem ?? ''"
                [alt]="imgAlt(evento)"
                aspect="square"
                sizes="56px"
                class="h-14 w-14 shrink-0 overflow-hidden rounded-full ring-2 ring-brand-ink/40"
              />
              <span class="flex flex-col gap-1">
                <span class="font-display text-h3 font-bold">{{ evento.titulo }}</span>
                <span class="text-sm opacity-80">{{ evento.dataHora }}</span>
              </span>
            </button>
          </li>
        }
      </ul>

      <button
        type="button"
        class="absolute right-6 top-6 flex h-10 w-10 items-center justify-center rounded-sm border border-brand-ink/50 text-brand-ink transition-transform duration-fast ease-out hover:bg-brand-deep motion-reduce:transition-none sm:right-10"
        [attr.aria-expanded]="expandido()"
        aria-label="Expandir ou recolher a agenda"
        (click)="alternar()"
      >
        <app-icon name="arrow-up" [class.rotate-180]="!expandido()" />
      </button>
    </div>
  </div>
}
