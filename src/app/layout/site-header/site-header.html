<header
  id="site-header"
  class="fixed inset-x-0 top-0 z-50 h-header transition-transform duration-280 ease-in-out-soft motion-reduce:translate-y-0 motion-reduce:transition-opacity motion-reduce:duration-fast motion-reduce:[&.is-hidden]:opacity-0"
  [class.-translate-y-full]="isHidden()"
  [class.is-hidden]="isHidden()"
>
  <span
    class="pointer-events-none absolute inset-0 z-0 bg-surface transition-opacity duration-300 ease-out motion-reduce:transition-none"
    [class.opacity-0]="!isSolid()"
    aria-hidden="true"
  ></span>
  <span
    class="pointer-events-none absolute inset-x-0 bottom-0 z-10 h-px bg-line transition-opacity duration-fast ease-out motion-reduce:transition-none"
    [class.opacity-0]="!isSolid()"
    aria-hidden="true"
  ></span>

  <div
    class="relative z-10 mx-auto grid h-header w-full grid-cols-[minmax(0,1fr)_auto] items-center px-4 sm:px-6 lg:grid-cols-[minmax(0,1fr)_auto] lg:pl-[6.25%] lg:pr-[5.5%]"
  >
    <a
      routerLink="/"
      class="flex min-w-0 items-center gap-2.5 justify-self-start no-underline"
      aria-label="Complexo Escolar Privado Sassapa — início"
    >
      <app-logo variant="mark" [tone]="logoTone()" class="h-10 w-9 shrink-0" />
      <span class="flex min-w-0 flex-col font-display text-nav font-bold uppercase leading-tight tracking-wider transition-colors duration-300 ease-out motion-reduce:transition-none"
        [class.text-white]="!isSolid()"
        [class.text-ink]="isSolid()"
      >
        <span class="whitespace-nowrap">Complexo Escolar</span>
        <span class="whitespace-nowrap">Privado Sassapa</span>
      </span>
    </a>

    <nav
      class="hidden min-w-0 items-center justify-around lg:absolute lg:inset-y-0 lg:left-[32.5%] lg:right-[15.2%] lg:flex"
      aria-label="Navegação principal"
    >
      @for (item of navItems; track item.rota) {
        <a
          [routerLink]="item.rota"
          routerLinkActive=""
          #rla="routerLinkActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
          [class.text-accent]="isSolid() && rla.isActive"
          [class.text-white]="!isSolid()"
          [class.text-ink-2]="isSolid() && !rla.isActive"
          class="group relative whitespace-nowrap font-display text-nav font-bold uppercase tracking-[0.06em] no-underline transition-colors duration-fast ease-out motion-reduce:transition-none"
        >
          {{ item.label }}
          <span
            class="absolute -bottom-2 left-0 h-0.5 w-full origin-left scale-x-0 bg-accent transition-transform duration-base ease-out motion-reduce:transition-none"
            [class.scale-x-100]="rla.isActive"
          ></span>
        </a>
      }
    </nav>

    <div class="flex items-center justify-self-end gap-[clamp(1.5rem,2.3vw,2.5rem)]">
      <button
        id="header-search"
        type="button"
        class="flex h-10 w-10 items-center justify-center rounded-sm transition-colors duration-fast ease-out hover:bg-surface-soft/30 cursor-pointer motion-reduce:transition-none"
        [class.text-ink]="isSolid()"
        [class.text-white]="!isSolid()"
        [attr.aria-expanded]="pesquisaAberta()"
        aria-controls="search-panel"
        aria-label="Pesquisar no site"
        (click)="alternarPesquisa()"
      >
        <img
          src="/assets/brand/search-svgrepo-com.svg"
          alt=""
          aria-hidden="true"
          class="h-5 w-5 transition-[filter] duration-fast ease-out motion-reduce:transition-none"
          [class.invert]="!isSolid()"
        />
      </button>

      <button
        id="header-menu-toggle"
        type="button"
        class="flex h-10 w-10 items-center justify-center rounded-sm transition-colors duration-fast ease-out hover:bg-surface-soft/30 cursor-pointer motion-reduce:transition-none"
        [class.text-ink]="isSolid()"
        [class.text-white]="!isSolid()"
        [attr.aria-expanded]="menuAberto()"
        aria-controls="menu-mobile"
        aria-label="Abrir menu"
        (click)="alternarMenu()"
      >
        <img
          [src]="menuAberto()
            ? '/assets/brand/close-svgrepo-com.svg'
            : '/assets/brand/menu-svgrepo-com.svg'"
          alt=""
          aria-hidden="true"
          class="h-5 w-5 transition-[filter] duration-fast ease-out motion-reduce:transition-none"
          [class.invert]="!isSolid()"
        />
      </button>
    </div>
  </div>
</header>

<app-search-panel />
